name: Source structure check (no Unreal compile)
on:
  push:
  pull_request:
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source structure and registered modules
        run: |
          python Scripts/verify_structure.py
          python Scripts/verify_systems.py
          python Scripts/verify_foundation_v04.py
      - name: Check v0.7 runtime structure
        run: python Scripts/verify_runtime_v07.py
      - name: Check v0.8 StateTree/EQS adapter structure
        run: python Scripts/verify_runtime_v08.py
